spring:
  cloud:
    nacos:
      server-addr: localhost:8848
    gateway:
      routes:
        - id: youthpathtalk-auth-service
          uri: lb://youthpathtalk-auth-service
          predicates:
            - Path=/auth/**,/code/**
        - id: youthpathtalk-user-service
          uri: lb://youthpathtalk-user-service
          predicates:
            - Path=/user/**
        - id: youthpathtalk-distributed-id-generator-service
          uri: lb://youthpathtalk-distributed-id-generator-service
          predicates:
            - Path=/id/**
        - id: youthpathtalk-post-service
          uri: lb://youthpathtalk-post-service
          predicates:
            - Path=/post/**
      globalcors: #应该显示地创建过滤器实例比保证优先级高于saReactorFilter
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173" #网关处统一允许前端（IP+端口）发出的跨域请求
            allowedMethods:
              - "GET"
              - "POST"
              - "DELETE"
              - "PUT"
              - "OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 360000
  data:
    redis:
      database: 0 # Redis 数据库索引（默认为 0）
      host: 127.0.0.1 # Redis 服务器地址
      port: 6379 # Redis 服务器连接端口
      password:  # Redis 服务器连接密码（默认为空）
      timeout: 5s # 读超时时间
      connect-timeout: 5s # 连接超时时间
      lettuce:
        pool:
          max-active: 200 # 连接池最大连接数
          max-wait: -1ms # 连接池最大阻塞等待时间（使用负值表示没有限制）
          min-idle: 0 # 连接池中的最小空闲连接
          max-idle: 10 # 连接池中的最大空闲连接